# Per-client limits for a public demo: agent runs spend LLM credit, uploads use disk.
# Only POST requests are counted; reads and SSE progress streams are never limited.
map $request_method $agent_write_key {
    POST    $binary_remote_addr;
    default "";
}
map $request_method $api_write_key {
    POST    $binary_remote_addr;
    DELETE  $binary_remote_addr;
    default "";
}
limit_req_zone $agent_write_key zone=agent_writes:10m rate=6r/m;
limit_req_zone $api_write_key zone=api_writes:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-sent events: deliver each frame immediately.
    proxy_buffering off;
    proxy_read_timeout 600s;

    location ~ ^/api/agent/(check|check/stream|tasks)$ {
        limit_req zone=agent_writes burst=3 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
    }

    location /api/ {
        limit_req zone=api_writes burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
