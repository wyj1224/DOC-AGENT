services:
  postgres:
    image: postgres:16
    container_name: clause-agent-postgres
    environment:
      POSTGRES_DB: clause_agent
      POSTGRES_USER: clause_agent
      POSTGRES_PASSWORD: clause_agent
    ports:
      - "5432:5432"
    volumes:
      - clause_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clause_agent -d clause_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clause_agent_pgdata:

