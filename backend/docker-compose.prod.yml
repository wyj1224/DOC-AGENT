# Production overrides for a single public server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
# Required in .env: DEEPSEEK_API_KEY, VISITOR_COOKIE_SECRET, ADMIN_TOKEN, POSTGRES_PASSWORD.
services:
  postgres:
    restart: unless-stopped

  api:
    build:
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    environment:
      # Fail at startup instead of running a public site with insecure defaults.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      VISITOR_COOKIE_SECRET: ${VISITOR_COOKIE_SECRET:?set VISITOR_COOKIE_SECRET in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # One process per core: Word parsing is CPU-bound and would otherwise share one GIL.
      WEB_CONCURRENCY: "2"
    restart: unless-stopped

  worker:
    build:
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    environment:
      # 2 GiB of RAM: keep parallel agent runs low.
      WORKER_CONCURRENCY: "2"
    restart: unless-stopped

  web:
    build:
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports: !override
      - "80:80"
    restart: unless-stopped
